  var r={due:0,trial:1,paid:2,lead:3,pause:4,off:5},x=r[clPay(a).k],y=r[clPay(b).k];
  if(x!==y)return x-y;

  return g||String(a.name||'').localeCompare(String(b.name||''),'ru');
}

function payCalc(x,what,date,n){

/* ---------- @ mentions: projects, contacts, tasks and other records ---------- */
var MNK={project:'проект',contact:'контакт',task:'задача',milestone:'майлстоун',event:'событие',post:'пост',service:'услуга',client:'клиент'},MNO=['project','contact','client','task','milestone','event','post','service'];
var mnCache=null,mn=null;
function mnList(){
  if(mnCache)return mnCache;
  var out=[];
  function add(k,id,name,x){name=String(name||'').replace(/\s+/g,' ').trim();if(name.length>=2&&name.length<=80)out.push({k:k,id:id,n:name,l:name.toLowerCase(),x:String(x||'')})}
  S.projects.forEach(function(p){add('project',p.id,p.name,p.area)});
  if(ui.owner){
    S.contacts.forEach(function(c){add('contact',c.id,c.name,c.role);var tg=tgUser(c.tg);if(tg)add('contact',c.id,tg,c.name)});
    S.clients.forEach(function(c){add('client',c.id,c.name,c.group)});
  }
  S.tasks.forEach(function(t){add('task',t.id,t.title,(P(t.project)||{}).name)});
  S.milestones.forEach(function(m){add('milestone',m.id,m.title,(P(m.project)||{}).name)});
  S.events.forEach(function(e){add('event',e.id,e.title,validDate(e.date)?fmt(e.date):'')});
  S.posts.forEach(function(p){add('post',p.id,p.title,'')});
  S.services.forEach(function(s){add('service',s.id,s.title||s.name,'')});
  out.sort(function(a,b){return b.n.length-a.n.length});
  mnCache=out;return out;
}
// Text with mentions turned into links. A mention is «@» plus the exact current name of a record.
function rich(text){
  var s=String(text==null?'':text);
  if(s.indexOf('@')<0)return esc(s);
  var idx=mnList(),out='',i=0,n=s.length,word=/[0-9A-Za-zА-Яа-яЁё_]/;
  while(i<n){
    var at=s.indexOf('@',i);
    if(at<0){out+=esc(s.slice(i));break}
    out+=esc(s.slice(i,at));
    var hit=null;
    if(at===0||!word.test(s.charAt(at-1))){
      var rest=s.substr(at+1,82).toLowerCase();
      for(var j=0;j<idx.length;j++){var m=idx[j];if(rest.lastIndexOf(m.l,0)===0){var nx=rest.charAt(m.l.length);if(!nx||!word.test(nx)){hit=m;break}}}
    }
    if(hit){out+='<span class="mn" role="link" data-act="mn" data-k="'+hit.k+'" data-id="'+esc(hit.id)+'" title="'+esc(MNK[hit.k])+'">@'+esc(s.substr(at+1,hit.n.length))+'</span>';i=at+1+hit.n.length}
    else{out+='@';i=at+1}
  }
  return out;
}

// What a merge would do: the fresher record wins, deletions on either side are kept.
function dataPlan(copy){
  var ops=[],st={add:0,upd:0,del:0,keep:0},docs=copy.docs||{};
  var obj=function(v){return !!v&&typeof v==='object'&&!Array.isArray(v)},okId=function(id){return /^[A-Za-z0-9_-]{1,64}$/.test(id)};
  var bare=function(x){var d=Object.assign({},x);delete d.id;return d},same=function(a,b){return JSON.stringify(a)===JSON.stringify(b)};
  var myGone={},theirGone=obj(docs.gone)?docs.gone:{};
  S.gone.forEach(function(g){myGone[g.id]=g});
  COLLS.forEach(function(k){
    if(k==='gone')return;
    var theirs=obj(docs[k])?docs[k]:{},mine={};
    S[k].forEach(function(x){mine[x.id]=x});
    Object.keys(theirs).forEach(function(id){
      var tv=theirs[id];if(!okId(id)||!obj(tv))return;
      var mv=mine[id],gid=goneId(k,id),tg=myGone[gid],tu=String(tv.u||'');
      if(!mv){
        if(tg&&String(tg.at||'')>=tu){st.keep++;return}
        ops.push(['set',k,id,tv]);st.add++;
        if(tg)ops.push(['del','gone',gid]);
      }else if(!same(bare(mv),tv)){
        if(tu>String(mv.u||'')){ops.push(['set',k,id,tv]);st.upd++}else st.keep++;
      }
    });
    Object.keys(mine).forEach(function(id){
      if(Object.prototype.hasOwnProperty.call(theirs,id))return;
      var g=theirGone[goneId(k,id)];
      if(obj(g)&&String(g.at||'')>String(mine[id].u||'')){ops.push(['del',k,id]);st.del++}
    });
  });
  Object.keys(theirGone).forEach(function(gid){
    var g=theirGone[gid];if(!okId(gid)||!obj(g)||typeof g.c!=='string'||typeof g.i!=='string')return;
    var mg=myGone[gid],live=Array.isArray(S[g.c])?byId(S[g.c],g.i):null;
    if(live&&String(live.u||'')>=String(g.at||''))return;

function dataRun(ops,out,done,fail){
  var i=0;
  (function next(){
    if(i>=ops.length){done();return}
    var op=ops[i++],pr;
    if(out&&(i%5===0||i===ops.length))out.textContent='Записываю: '+i+' из '+ops.length;
    if(op[1]==='settings'){var tzb=appTz();if(!db){S.settings=Object.assign({capacity:40},op[3]);tzChanged(tzb)}}
    else if(!db){S[op[1]]=S[op[1]].filter(function(x){return x.id!==op[2]});if(op[0]==='set')S[op[1]].push(Object.assign({id:op[2]},op[3]))}
    if(!db)pr=Promise.resolve();
    else{var ref=db.collection(op[1]).doc(op[2]);pr=op[0]==='del'?ref.delete():ref.set(op[3])}
    Promise.resolve(pr).then(next,function(){fail(i,ops.length)});

function capRing(cap){

    var g=len>=W?0:Math.min(1.2,len/W*C/3),d=Math.max(.5,len/W*C-g),o='<circle class="'+(cls||'')+'" cx="60" cy="60" r="'+R+'" style="'+style+'" stroke-dasharray="'+d.toFixed(2)+' '+(C-d).toFixed(2)+'" stroke-dashoffset="'+(-(at/W*C)).toFixed(2)+'"/>';
    at+=len;return o;
  }
  var segs=L.items.map(function(p){return arc(Math.min(+p.hours,W-at),'stroke:'+pc(p.id))}).join('')+arc(Math.min(free,W-at),'','rg-free');

    '<ul class="rg-l"><li><i class="rg-k k-used"></i>занято проектами <b>'+L.total+' ч</b></li><li><i class="rg-k k-free"></i>'+(over?'перегруз <b>'+(L.total-cap)+' ч</b>':'свободно <b>'+(cap-L.total)+' ч</b>')+'</li><li><i class="rg-k k-week"></i>остальная неделя <b>'+Math.max(0,W-Math.max(cap,L.total))+' ч</b></li></ul>'+

var AUDIO_EXT=/\.(ogg|oga|opus|mp3|m4a|wav|aac|flac|amr|webm)$/i;
function decodeText(buf){
  var u=new Uint8Array(buf),enc='utf-8';
  if(u.length>1&&u[0]===0xFF&&u[1]===0xFE)enc='utf-16le';else if(u.length>1&&u[0]===0xFE&&u[1]===0xFF)enc='utf-16be';
  try{return new TextDecoder(enc).decode(u)}catch(e){return new TextDecoder().decode(u)}
}
function tgJson(o){
  var msgs=o&&Array.isArray(o.messages)?o.messages:null;if(!msgs)return null;
  var lines=[];
  msgs.forEach(function(x){
    if(!x||x.type!=='message')return;
    var t=x.text;
    if(Array.isArray(t))t=t.map(function(part){return typeof part==='string'?part:(part&&typeof part.text==='string'?part.text:'')}).join('');
    if(typeof t!=='string')t='';
    if(!t&&x.media_type)t='['+String(x.media_type)+']';
    if(!t)return;
    lines.push(String(x.date||'').slice(0,16).replace('T',' ')+' '+String(x.from||'')+': '+t);
  });
  return {text:lines.join('\n'),name:typeof o.name==='string'?o.name:''};
}
function htmlToText(s){
  try{
    var d=new DOMParser().parseFromString(s,'text/html');
    var ms=d.querySelectorAll('.message.default');
    if(ms.length){
      var out=[],last='';
      Array.prototype.forEach.call(ms,function(el){
        var f=el.querySelector('.from_name'),t=el.querySelector('.text'),dt=el.querySelector('.date');
        if(f)last=f.textContent.trim();
        if(t)out.push((dt&&dt.getAttribute('title')?dt.getAttribute('title').slice(0,16)+' ':'')+last+': '+t.textContent.trim());
      });
      return out.join('\n');
    }
    Array.prototype.forEach.call(d.querySelectorAll('script,style,noscript'),function(e){e.parentNode.removeChild(e)});
    return (d.body?d.body.textContent:'').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  }catch(e){return ''}
}
function pickFile(b,file){
  var out=b.querySelector('#fl-out'),au=b.querySelector('#fl-audio'),tx=b.querySelector('#f-text');
  dropBlob();au.innerHTML='';out.textContent='';
  b.querySelector('#f-fname').value='';b.querySelector('#f-fkind').value='';
  if(!file)return;
  var name=String(file.name||'файл').slice(0,120);
  if(/^audio\//.test(file.type||'')||AUDIO_EXT.test(name)){
    try{blobUrl=URL.createObjectURL(file)}catch(e){blobUrl=null}
    b.querySelector('#f-fname').value=name;b.querySelector('#f-fkind').value='audio';
    au.innerHTML=(blobUrl?'<audio controls preload="metadata" src="'+esc(blobUrl)+'"></audio>':'')+'<p class="sg-out">Расшифровывать аудио страница не умеет, и сам файл в дэшборде не сохраняется. Прослушай и запиши суть в поле текста. Чтобы получить расшифровку автоматически, пришли файл Claude в чат: сообщение появится здесь и будет ждать ревью.</p>';
    out.textContent='Аудио: '+name;
    if(b.querySelector('#f-channel'))b.querySelector('#f-channel').value='tg';
    return;
  }
  if(file.size>5*1024*1024){out.textContent='Файл больше 5 МБ. Выгрузи переписку за меньший период или вставь нужный фрагмент текстом.';b.querySelector('#f-file').value='';return}
  var rd=new FileReader();
  rd.onerror=function(){out.textContent='Не получилось прочитать файл. Попробуй вставить текст вручную.'};
  rd.onload=function(){
    if(!b.isConnected)return;
    var raw=decodeText(rd.result),text=raw,from='';
    if(/\.json$/i.test(name)){try{var tj=tgJson(JSON.parse(raw));if(tj){text=tj.text;from=tj.name}}catch(e){}}
    else if(/\.html?$/i.test(name))text=htmlToText(raw)||'';
    text=String(text).replace(/\u0000/g,'').trim();
    if(!text){out.textContent='В файле не нашлось текста.';return}
    var cut=text.length>8000;
    if(cut){text=text.slice(-8000);var nl=text.indexOf('\n');if(nl>0&&nl<400)text=text.slice(nl+1)}
    tx.value=text;
    b.querySelector('#f-fname').value=name;b.querySelector('#f-fkind').value='text';
    var fr=b.querySelector('#f-from');if(from&&!fr.value&&!b.querySelector('#f-contact').value)fr.value=from.slice(0,80);
    out.textContent='Прочитан файл '+name+(cut?': взяты последние 8000 знаков':': '+text.length+' знаков');
  };
  rd.readAsArrayBuffer(file);
}

function bubble(box,role,text){var d=document.createElement('div');d.className='bub '+role;d.textContent=text;box.appendChild(d);return d}
function saveChat(id,q,a){

function chatSend(b,id,q){

var msDrag=null;
function fmtDM(s){var d=parse(s);return d.getDate()+' '+MON[d.getMonth()]}
function dayLabel(s){var d=parse(s);return d.getDate()+' '+MON[d.getMonth()]+', '+DOW[(d.getDay()+6)%7]}
function tipPos(n,span){return Math.max(4,Math.min(96,n/span*100)).toFixed(3)}
function placeMs(el,track,day){
  var span=+track.dataset.span||1,p=Math.max(0,Math.min(100,day/span*100)).toFixed(3);
  el.style.left=p+'%';el.dataset.day=day;
  var line=track.querySelector('.dm-line'),tip=track.querySelector('.dm-tip');
  if(line)line.style.left=p+'%';
  if(tip){tip.style.left=tipPos(day,span)+'%';tip.textContent=dayLabel(addDays(track.dataset.st,day))}
}
function selectMs(el){
  var track=el.parentNode,lane=track.parentNode,v=$('#view');
  Array.prototype.forEach.call(v.querySelectorAll('.lane.sel'),function(x){if(x!==lane)x.classList.remove('sel')});
  Array.prototype.forEach.call(v.querySelectorAll('.dm.on'),function(x){if(x!==el)x.classList.remove('on')});
  lane.classList.add('sel');el.classList.add('on');ui.msSel=el.dataset.id;
  placeMs(el,track,+el.dataset.day||0);
}
function clearMsSel(){
  if(!ui.msSel)return;ui.msSel=null;
  var v=$('#view');
  Array.prototype.forEach.call(v.querySelectorAll('.lane.sel'),function(x){x.classList.remove('sel')});
  Array.prototype.forEach.call(v.querySelectorAll('.dm.on'),function(x){x.classList.remove('on')});
}
function msDown(e){
  var el=e.target.closest?e.target.closest('.dm[data-id]'):null;
  ui.msKb=false;
  if(!el){if(ui.msSel&&!(e.target.closest&&e.target.closest('.lane.sel')))clearMsSel();return}
  if(e.button!=null&&e.button!==0)return;
  var was=ui.msSel===el.dataset.id;
  selectMs(el);
  if(ui.ro)return;
  msDrag={el:el,id:el.dataset.id,track:el.parentNode,x0:e.clientX,moved:false,day0:+el.dataset.day||0,day:+el.dataset.day||0,was:was,pid:e.pointerId};
  ui.dragging=true;
  try{el.setPointerCapture(e.pointerId)}catch(err){}
  e.preventDefault();
}
function msMove(e){
  var d=msDrag;if(!d||(d.pid!=null&&e.pointerId!==d.pid))return;
  if(!d.moved){if(Math.abs(e.clientX-d.x0)<4)return;d.moved=true;document.body.classList.add('dragms')}
  var r=d.track.getBoundingClientRect(),span=+d.track.dataset.span||1;
  var day=Math.max(0,Math.min(span,Math.round((e.clientX-r.left)/r.width*span)));
  if(day!==d.day){d.day=day;placeMs(d.el,d.track,day)}
}
function msUp(e,cancel){
  var d=msDrag;if(!d)return;
  msDrag=null;ui.dragging=false;document.body.classList.remove('dragms');
  if(cancel){placeMs(d.el,d.track,d.day0)}
  else if(d.moved){
    ui.justDragged=true;setTimeout(function(){ui.justDragged=false},80);
    if(d.day!==d.day0)patch('milestones',d.id,{date:addDays(d.track.dataset.st,d.day)});
  }else if(d.was){formMs(d.id)}
  if(ui.needDraw||d.moved){ui.needDraw=false;render()}
}
function msKey(e){
  var el=e.target.closest?e.target.closest('.dm[data-id]'):null;if(!el)return false;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();formMs(el.dataset.id);return true}
  if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&!ui.ro){
    e.preventDefault();
    var track=el.parentNode,span=+track.dataset.span||1,day=+el.dataset.day||0;

function removeEntity(kind,id){
  var map={project:'projects',task:'tasks',milestone:'milestones',event:'events',money:'money',contact:'contacts',message:'messages',note:'log',post:'posts',channel:'channels',service:'services',sub:'subs',client:'clients'},coll=map[kind];if(!coll)return;
  var chain=Promise.resolve();
  if(kind==='project'){
    ['tasks','milestones','events','log','messages'].forEach(function(c){S[c].filter(function(x){return x.project===id}).forEach(function(x){chain=chain.then(function(){return del(c,x.id)})})});
    S.money.filter(function(x){return x.project===id}).forEach(function(x){chain=chain.then(function(){return patch('money',x.id,{project:''})})});
    S.posts.filter(function(x){return x.project===id}).forEach(function(x){chain=chain.then(function(){return patch('posts',x.id,{project:''})})});
    S.subs.filter(function(x){return x.project===id}).forEach(function(x){chain=chain.then(function(){return patch('subs',x.id,{project:''})})});
    S.clients.filter(function(x){return x.project===id}).forEach(function(x){chain=chain.then(function(){return patch('clients',x.id,{project:''})})});
    S.contacts.filter(function(x){return cProjects(x).indexOf(id)>=0}).forEach(function(x){chain=chain.then(function(){return patch('contacts',x.id,{projects:cProjects(x).filter(function(q){return q!==id})})})});
    if(ui.project===id)setProject('all',true);
  }
  if(kind==='contact'){var cn=byId(S.contacts,id);S.messages.filter(function(x){return x.contact===id}).forEach(function(x){chain=chain.then(function(){return patch('messages',x.id,{contact:'',from:cn?cn.name:''})})});S.tasks.filter(function(x){return x.contact===id}).forEach(function(x){chain=chain.then(function(){return patch('tasks',x.id,{contact:''})})});S.events.filter(function(x){return x.contact===id}).forEach(function(x){chain=chain.then(function(){return patch('events',x.id,{contact:''})})})}
  if(kind==='milestone')S.tasks.filter(function(t){return t.milestone===id}).forEach(function(t){chain=chain.then(function(){return patch('tasks',t.id,{milestone:''})})});
  chain.then(function(){return del(coll,id)});
  closeSheet();
}

    case 'cweek':o=weekStart(today());ui.cweek=d.v==='0'?o:addDays(validDate(ui.cweek)?ui.cweek:o,7*(+d.v||0));render();break;
    case 'cycle-goal':if(!ui.ro)formCycleGoal(d.id);break;
    case 'cycle-pick':if(!ui.ro)formCyclePick(d.id,d.w);break;
    case 'cycle-new':if(!ui.ro)formPost({project:d.id,week:d.w});break;
    case 'cycle-add':if(ui.ro||!byId(S.posts,d.id)||!validDate(d.w))break;patch('posts',d.id,{week:d.w});o=byId(S.posts,d.id);if(o)o.week=d.w;o=$('#cy-pick');if(o)o.innerHTML=cycleList(o.dataset.id,o.dataset.w);render();break;
    case 'cycle-rm':if(!ui.ro&&byId(S.posts,d.id))patch('posts',d.id,{week:''});break;
    case 'mc-set':formMc();break;
    case 'adapt':adaptOne(d.ch);break;
    case 'adapt-all':adaptAll();break;
    case 'v-save':case 'v-ready':case 'v-pub':case 'v-copy':case 'v-mc':vAction(d.act,d.ch);break;
    case 'more':openSheet('Разделы','<div class="menu">'+views().filter(function(v){return ['overview','plan','board','calendar'].indexOf(v)<0}).map(function(v){return '<button data-act="view" data-v="'+v+'">'+VIEWS[v]+'</button>'}).join('')+'</div>');break;
    case 'rv-apply':applyProposal(d.id);break;
    case 'rv-reject':if(t.dataset.armed)rejectProposal(d.id);else{t.dataset.armed='1';t.textContent='Точно отклонить?'}break;
    case 'rv-done':rejectProposal(d.id);break;
    case 'relf':ui.relf=d.v||'';render();break;
    case 'mn':e.preventDefault();mnOpen(d.k,d.id);break;
    case 'pop-set':popSet(d.v||'',false);break;
    case 'pop-ok':o=$('#pop-time');popSet(o?o.value:'',false);break;
    case 'pop-undo':popUndo();break;
    case 'data':formData();break;
    case 'activity':formActivity();break;
    case 'data-save':dataSave();break;
    case 'data-copy':dataCopy();break;
    case 'data-peek':dataPeek(t,d.v);break;
    case 'data-paste':o=$('#data-in');if(o){o.hidden=!o.hidden;t.setAttribute('aria-expanded',String(!o.hidden));if(!o.hidden)o.focus()}break;
    case 'data-load':dataLoad(t);break;
    case 'data-merge':dataMerge(t);break;
    case 'rv-parse':reAnalyze(d.id);break;
  }
});
document.addEventListener('keydown',function(e){if(mnKey(e))e.stopImmediatePropagation()},true);
document.addEventListener('keydown',function(e){
  if(selKey(e))return;
  if(e.key==='Escape'&&selOpen){selHide();return}
  if(e.key==='Escape'&&pop){popClose();return}
  if(e.key==='Escape'&&!$('#sheet').hidden){closeSheet();return}
  if(e.key==='Escape'&&ui.msSel){clearMsSel();return}
  if(msKey(e))return;
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&e.target&&e.target.id==='log-i'&&e.target.form){e.preventDefault();if(e.target.form.requestSubmit)e.target.form.requestSubmit();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('div[role="button"]')){e.preventDefault();e.target.click()}
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target,i,txt;
  if(ui.ro)return;
  if(f.id==='inbox-f'){i=$('#inbox-i');txt=i.value.trim();if(!txt)return;i.value='';put('inbox',uid('i'),{text:txt.slice(0,300)})}
  else if(f.id==='log-f'){i=$('#log-i');txt=i.value.trim();if(!txt||ui.project==='all')return;i.value='';put('log',uid('l'),{project:ui.project,text:txt.slice(0,4000),tag:tagFromLabel(($('#log-tag')||{}).value||'insight'),at:new Date().toISOString()})}
  else if(f.id==='chat-f'){chatSend($('#sheet-b'),f.dataset.id,$('#chat-i').value.trim())}
  else if(f.id==='plan-f'){i=$('#plan-i');txt=i.value.trim();var pp=$('#plan-p'),pj=ui.project!=='all'&&P(ui.project)?ui.project:(pp&&P(pp.value)?pp.value:'');if(!txt||!pj||!validDate(f.dataset.d))return;i.value='';ui.pproj=pj;put('tasks',uid('t'),{title:txt.slice(0,200),project:pj,status:'todo',due:f.dataset.d,milestone:'',notes:'',order:maxOrder(S.tasks)+1})}
  else if(f.dataset.form)save(f.dataset.form,f.dataset.id,vals(f),f);
});
window.addEventListener('hashchange',function(){readHash();render()});
document.addEventListener('input',function(e){var t=e.target;if(t&&t.classList&&t.classList.contains('v-text'))countVar(t);mnInput(t)});
document.addEventListener('focusout',function(e){if(mn&&e.target===mn.el)setTimeout(function(){if(mn&&document.activeElement!==mn.el)mnHide()},150)});
['pointerdown','mousedown'].forEach(function(n){document.addEventListener(n,function(e){if(e.target.closest&&e.target.closest('#mnpop'))e.preventDefault()},true)});
document.addEventListener('pointerdown',function(e){var t=e.target&&e.target.closest?e.target:null;if(pop&&!(t&&t.closest('#pop')))popClose();if(selOpen&&!(t&&(t.closest('#selpop')||t.closest('button.sel')===selOpen.btn)))selHide()},true);
window.addEventListener('resize',function(){if(pop)popPlace();selHide();mnHide()});
document.addEventListener('scroll',function(e){if(pop)popPlace();if(selOpen&&!(e.target&&e.target.id==='selpop'))selPlace()},true);
document.addEventListener('change',function(e){var t=e.target;if(t&&t.tagName==='SELECT')selSync(t)});
new MutationObserver(function(){if(!selRaf)selRaf=requestAnimationFrame(function(){selRaf=0;selEnhance(document)})}).observe(document.body,{childList:true,subtree:true});
document.addEventListener('pointerdown',msDown);
document.addEventListener('pointermove',msMove);
document.addEventListener('pointerup',function(e){msUp(e,false)});
document.addEventListener('pointercancel',function(e){msUp(e,true)});
document.addEventListener('focusin',function(e){var el=e.target&&e.target.closest?e.target.closest('.dm[data-id]'):null;if(el&&!msDrag&&ui.msSel!==el.dataset.id)selectMs(el)});
var mq=window.matchMedia('(min-width:900px)');
if(mq.addEventListener)mq.addEventListener('change',function(){initSort()});

/* ---------- start ---------- */
function start(){
  readHash();actStart();
  try{var om=/[?&]open=msg-([\w-]{1,64})/.exec(location.search||'');if(om)ui.open=om[1]}catch(e){}
  try{var sp=localStorage.getItem('dash.project');if(sp)ui.project=sp}catch(e){}
  draw();
  var c=window.claude;
  if(!c||typeof c.use!=='function'){ui.mode='local';if(ui.project!=='all')ui.project='all';render();return}
  var timer=setTimeout(function(){if(ui.mode==='loading'){ui.mode='slow';render()}},10000);
  Promise.resolve(c.use('db')).then(function(d){
    if(!d){clearTimeout(timer);ui.mode='local';ui.project='all';render();return}
    db=d;
    COLLS.forEach(function(k){
      db.collection(k).onSnapshot(function(snap){
        S[k]=snap.docs.map(function(x){var o=Object.assign({},x.data()||{});o.id=x.id;return o});
        loaded[k]=true;
        if(k==='activity'){actPaint();return}
        if(k==='gone')return;
        if(CORE.every(function(n){return loaded[n]})){clearTimeout(timer);ui.mode='ready'}
        render();
        if(ui.open&&loaded.messages&&ui.mode==='ready'){var om=byId(S.messages,ui.open);ui.open='';if(om)setTimeout(function(){viewMessage(om.id)},60)}
      },function(){if(CORE.indexOf(k)<0){S[k]=[];loaded[k]=true;render();return}clearTimeout(timer);ui.mode='error';render()});
    });
    db.doc('settings/main').onSnapshot(function(s){var tzb=appTz();if(s.exists)S.settings=Object.assign({capacity:40},s.data()||{});tzChanged(tzb);render()},function(){});
  }).catch(function(){clearTimeout(timer);ui.mode='local';render()});
  Promise.resolve(c.use('user')).then(function(u){
    if(!u||typeof u.can!=='function')return;
    if(typeof u.isOwner==='function')Promise.resolve(u.isOwner()).then(function(v){if(v===false){ui.owner=false;render()}}).catch(function(){});
    return Promise.resolve(u.can('data.write')).then(function(v){if(v===false){ui.ro=true;document.body.classList.add('ro');render()}});
  }).catch(function(){});
  Promise.resolve(c.use('sample')).then(function(f){if(typeof f==='function')sampleFn=f}).catch(function(){});
  Promise.resolve(c.use('mcp')).then(function(m){if(m&&typeof m.callTool==='function')mcNs=m}).catch(function(){});
  Promise.resolve(c.use('files')).then(function(f){if(f&&typeof f.upload==='function')filesNs=f}).catch(function(){});
  Promise.resolve(c.use('downloads')).then(function(x){if(x&&typeof x.save==='function')dlNs=x}).catch(function(){});
}
start();
})();
</script>
