<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Анкета</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* The onboarding form. Same palette and type as the dashboard; one step per screen, answers by tapping. */
:root{
  --bg:#eceef3; --surface:#ffffff; --surface2:#f3f4f8; --ink:#14161c; --mute:#5f6575; --line:#dcdfe8;
  --accent:#1c8556; --on-accent:#ffffff; --crit:#c2362b;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e1015; --surface:#171a22; --surface2:#1e222c; --ink:#eceef4; --mute:#9aa1b2; --line:#2b303c;
  --accent:#4fc48c; --on-accent:#06281a; --crit:#f2766a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.body{flex:1;padding:20px 18px 24px;display:flex;flex-direction:column;gap:22px}
/* the header and the footer stay in place; only the questions scroll between them */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:10px;padding:12px max(18px,calc(50% - 262px)) calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.body.pad-b{padding-bottom:calc(98px + env(safe-area-inset-bottom))}
.body.pad-t{padding-top:calc(84px + env(safe-area-inset-top))}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:center}
.btn.pri{flex:1;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.wide{width:100%}
a.btn{text-decoration:none;color:inherit}
a.btn.pri{color:var(--on-accent)}
.btn[disabled]{opacity:.55}
.link{color:var(--mute);font-weight:500;text-decoration:underline;text-underline-offset:3px;padding:8px 0;align-self:center}

/* progress */
.top{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(4px + env(safe-area-inset-top)) max(18px,calc(50% - 262px)) 10px;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;gap:4px}
.seg{flex:1;padding:12px 0 10px;min-width:0}
.seg i{display:block;height:6px;border-radius:3px;background:var(--line)}
.seg.on i{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.seg.cur i{background:var(--accent)}
.top-t{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute)}
.top-t b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top-t span{white-space:nowrap}

/* hello and home */
.kick{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.h1{font:600 34px/1.1 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.h2{font:600 22px/1.2 var(--display);letter-spacing:-.01em;text-wrap:balance}
.lead{color:var(--mute)}
.facts{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.fact{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.fact b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);font:600 13px/1 var(--body)}
.hero{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.ok{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.card{padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.card h3{font:600 17px/1.25 var(--display)}
.small{font-size:13px;color:var(--mute)}

/* questions */
.q{display:flex;flex-direction:column;gap:10px}
.q-l{font-weight:600;font-size:17px;line-height:1.3;text-wrap:pretty}
.q-l .req{color:var(--accent)}
.q-h{font-size:13px;color:var(--mute);margin-top:-6px}
.q-e{font-size:13px;color:var(--crit);font-weight:500}
input[type=text],input[type=tel],input[type=email],input[type=url],textarea{width:100%;min-height:50px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
textarea{min-height:110px;resize:vertical;line-height:1.4}
.q.bad input,.q.bad textarea{border-color:var(--crit)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.o{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;min-height:50px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);width:100%}
.opts.row .o{width:auto;flex:1 1 auto;grid-template-columns:1fr;text-align:center;padding:10px 16px}
.opts.row .o .mk{display:none}
.mk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.o.one .mk{border-radius:50%}
.o.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.o.on .mk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opts.row .o.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.q.sub{margin:2px 0 6px 6px;padding:2px 0 2px 14px;border-left:3px solid color-mix(in srgb,var(--accent) 45%,var(--line))}
.q-of{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.agree{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);width:100%;font-weight:500}
.agree.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.agree.on .mk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.agree.bad{border-color:var(--crit)}
.show ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.show p{white-space:pre-line}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.o.nope{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* poll */
.pv{display:flex;flex-direction:column;gap:8px}
.po{position:relative;overflow:hidden;display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;min-height:54px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);width:100%}
.po>*{position:relative}
.po .fill{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 16%,transparent);transition:width .3s}
.po.on{border-color:var(--accent)}
.po.on .mk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.po-t{font-weight:600;display:block}
.po-w{display:block;font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.po-n{font:600 17px/1 var(--display);font-variant-numeric:tabular-nums}
.mk.rnd{border-radius:50%}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tm{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);text-align:center}
.tm-t{font-weight:600;font-variant-numeric:tabular-nums}
.tm-n{font-size:12px;min-height:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.tm.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tm.on .tm-n{color:inherit}
.tm.lead{box-shadow:0 0 0 2px var(--accent)}
.win{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));font-size:14px}
.wl{display:flex;flex-direction:column;gap:6px;font-size:13px}
.wl div{display:grid;grid-template-columns:48px 1fr;gap:8px}
.wl b{font-variant-numeric:tabular-nums}
.wl span{color:var(--mute);overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.prev{margin:0;padding:9px 18px;font-size:13px;line-height:1.4;color:var(--ink);background:var(--surface2);border-bottom:1px solid var(--line)}
.prev b{font-weight:600}
</style>
</head>
<body>
<div id="app" aria-live="polite"><div class="body"><p class="lead">Загружаю анкету…</p></div></div>
<script>
(function(){
'use strict';
var tg=window.Telegram&&window.Telegram.WebApp, initData=(tg&&tg.initData)||'';
var token=(/\/join\/([A-Za-z0-9_-]{12,40})/.exec(location.pathname)||[])[1]||'';
// Preview: the dashboard shows this page in a frame at /preview/<project>. The form comes from the owner's API,
// answers stay in the page and nothing is sent or kept.
var pvProject=(/^\/preview\/([A-Za-z0-9_-]{1,64})/.exec(location.pathname)||[])[1]||'', preview=!!pvProject;
var pvSession=preview?decodeURIComponent((/[#&]t=([^&]+)/.exec(location.hash||'')||[])[1]||''):'', pvForm=preview&&/[?&]form=invite/.test(location.search||'')?'invite':'';
if(preview){token='preview';try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
var app=document.getElementById('app'), KEY='prooloog.join.'+token;
var F=null, info=null, me=null, A={}, scr='load', part='core', step=0, bad={}, busy=false, note='', seen={}, agreed=false, card=false;
var CHECK='<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 6.5l2.6 2.6L10 3.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function theme(){var dark=tg&&tg.colorScheme?tg.colorScheme==='dark':window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.setAttribute('data-theme',dark?'dark':'light')}
function haptic(k){try{if(tg&&tg.HapticFeedback){if(k==='ok'||k==='error')tg.HapticFeedback.notificationOccurred(k==='ok'?'success':'error');else tg.HapticFeedback.selectionChanged()}}catch(e){}}
function keep(){if(preview)return;try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}}
function kept(){if(preview)return {};try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return {}}}
function api(method,path,body){
  var url=preview?'/api/onboard/'+pvProject+'/preview'+(pvForm?'?form='+pvForm:''):'/api/join/'+token+path, hd=body?{'Content-Type':'application/json'}:{};
  if(preview)hd.Authorization='Bearer '+pvSession;
  return fetch(url,{method:method,headers:hd,body:body?JSON.stringify(body):undefined}).then(function(r){
    return r.json().catch(function(){return null}).then(function(j){if(!r.ok){var e=new Error((j&&j.error)||'http_'+r.status);e.code=(j&&j.error)||'';e.fields=(j&&j.fields)||[];throw e}return j});
  },function(){var e=new Error('network');e.code='network';throw e});
}
// a question or a step with "when" is asked only while the answer it points at holds one of the listed options
function holds(w){
  if(!w||!w.q)return true;
  var v=A[w.q], list=Array.isArray(v)?v:(v===undefined||v===null||v==='')?[]:[String(v)];
  return (w.in||[]).some(function(o){return list.indexOf(o)>=0});
}
function steps(p){return F.steps.filter(function(s){return s.part===p&&holds(s.when)})}
function shown(s){return s.qs.filter(function(q){return holds(q.when)})}
// follow-ups open right under the option that brings them: they are drawn inside their question, not after it
function stepOf(q){return F.steps.filter(function(s){return s.qs.indexOf(q)>=0})[0]}
function nested(q){var s=stepOf(q),par=q.when&&s?s.qs.filter(function(x){return x.id===q.when.q})[0]:null;return par&&par.opts&&!par.row?par:null}
function under(q,o){var s=stepOf(q);return s?s.qs.filter(function(x){return nested(x)===q&&x.when.in.indexOf(o)>=0&&holds(x.when)}):[]}
function feeds(qid){return F.steps.some(function(s){return (s.when&&s.when.q===qid)||s.qs.some(function(q){return q.when&&q.when.q===qid})})}
// the questions everybody gets: follow-ups and branches are not counted in advance
function qCount(p){return F.steps.filter(function(s){return s.part===p&&!s.when}).reduce(function(n,s){return n+s.qs.filter(function(q){return !q.when}).length},0)}
function plural(n,a,b,c){var m=n%100,d=n%10;return m>10&&m<20?c:d===1?a:d>1&&d<5?b:c}
function isOther(v){return typeof v==='string'&&v.indexOf('Другое')===0}
function otherText(v){return isOther(v)?v.replace(/^Другое(: )?/,''):''}

/* ---------- screens ---------- */
function render(){
  var h='';
  if(scr==='form')seen[part+step]=true;
  if(scr==='gate')h=gate();else if(scr==='hello')h=hello();else if(scr==='form')h=formScr();else if(scr==='home')h=home();
  else if(scr==='error')h='<div class="body"><h1 class="h2">Не получилось открыть анкету</h1><p class="lead">'+esc(note)+'</p><button class="btn wide" data-act="reload">Обновить</button></div>';
  if(preview&&scr!=='error')h='<p class="prev" role="note"><b>Предпросмотр.</b> Так анкету видит человек. Ответы не сохраняются, обязательные вопросы можно пропускать.</p>'+h;
  app.innerHTML=h;
  try{if(tg&&tg.BackButton){if(scr==='form')tg.BackButton.show();else tg.BackButton.hide()}}catch(e){}
}
function gate(){
  var url=info&&info.bot?'https://t.me/'+info.bot+'?start=join_'+token:'';
  return '<div class="body"><p class="kick">'+esc(F?F.kicker:'Анкета')+'</p><h1 class="h1">'+esc(F?F.title:'Анкета')+'</h1><p class="lead">Анкета открывается внутри Telegram: так мы узнаём вас без паролей и регистрации.</p>'+
    (url?'<a class="btn pri" style="flex:none" href="'+esc(url)+'">Открыть в Telegram</a>':'')+'</div>';
}
function hello(){
  var n=qCount('core'), first=me&&me.user.name?me.user.name.split(' ')[0]:'';
  var polls=(F.polls||[]).length?(F.pollsNote||'проголосовать'):'';
  return '<div class="body pad-b"><p class="kick">'+esc(F.kicker||'Анкета')+'</p><h1 class="h1">'+esc(F.title)+'</h1><p class="lead">'+(first?esc(first)+', здравствуйте! ':'')+esc(F.intro||'')+'</p>'+
    '<div class="facts"><div class="fact"><b>1</b><span>'+n+' '+plural(n,'вопрос','вопроса','вопросов')+', '+esc(F.coreTime||'пара минут')+'. Почти везде достаточно нажать на вариант.</span></div>'+
    '<div class="fact"><b>2</b><span>'+(card?'Некоторые ответы раскрываются парой уточняющих вопросов. После отправки откроется страница о проекте «'+esc(info.project)+'».':'Сразу после отправки вы в проекте «'+esc(info.project)+'»: видите задачи команды и можете вести свои.')+'</span></div>'+
    (polls?'<div class="fact"><b>3</b><span>В конце можно '+esc(polls)+'.</span></div>':'')+'</div>'+
    (preview?'<button class="link" data-act="pv-home">Показать, что человек видит после анкеты</button>':'')+
    (me.owner?'<p class="small">Вы владелец: анкета сохранится как ваша, доступы не меняются.</p><button class="link" data-act="home">'+(card?'Посмотреть страницу о проекте без анкеты':'Посмотреть голоса без анкеты')+'</button>':'')+
    '</div><div class="foot"><button class="btn pri" data-act="begin">Начать</button></div>';
}
function formScr(){
  var ss=steps(part), s=ss[step], last=step===ss.length-1, h='';
  h+='<div class="top"><div class="bar" role="tablist" aria-label="Шаги анкеты">'+ss.map(function(x,i){return '<button type="button" role="tab" aria-selected="'+(i===step)+'" class="seg'+(i===step?' cur':i<step||seen[part+i]?' on':'')+'" data-act="go" data-i="'+i+'" aria-label="Шаг '+(i+1)+': '+esc(x.title)+'"><i></i></button>'}).join('')+'</div><div class="top-t"><b>'+esc(s.title)+'</b><span>'+(part==='more'?'по желанию · ':'')+(step+1)+' из '+ss.length+'</span></div></div>';
  h+='<div class="body pad-t pad-b"><h1 class="h2">'+esc(s.title)+'</h1>'+(s.text?'<p class="lead">'+esc(s.text)+'</p>':'')+shown(s).filter(function(q){return !nested(q)}).map(question).join('');
  if(part==='core'&&last&&F.agree)h+='<button type="button" class="agree'+(agreed?' on':'')+(bad._agree?' bad':'')+'" role="checkbox" aria-checked="'+agreed+'" data-act="agree"><span class="mk">'+CHECK+'</span><span>'+esc(F.agree)+'</span></button>'+(bad._agree?'<p class="q-e" role="alert">'+esc(bad._agree)+'</p>':'');
  if(part==='core'&&last&&F.consent)h+='<p class="small">'+esc(F.consent)+'</p>';
  if(note)h+='<p class="q-e" role="alert">'+esc(note)+'</p>';
  h+='</div><div class="foot"><button class="btn" data-act="back" aria-label="Назад">Назад</button><button class="btn pri" data-act="next"'+(busy?' disabled':'')+'>'+(busy?'Сохраняю…':part==='core'?(last?'Отправить':'Дальше'):(last?'Готово':'Сохранить и дальше'))+'</button></div>';
  return h;
}
function question(q){
  var v=A[q.id], h='<div class="q'+(q.sub?' sub':'')+(bad[q.id]?' bad':'')+'" data-q="'+esc(q.id)+'">'+(q.sub?'<span class="q-of">'+esc(q.sub)+'</span>':'')+'<label class="q-l"'+(q.opts?'':' for="i-'+esc(q.id)+'"')+'>'+esc(q.label)+(q.req?' <span class="req" aria-hidden="true">*</span>':'')+'</label>';
  if(q.hint)h+='<p class="q-h">'+esc(q.hint)+'</p>';
  if(q.opts){
    var arr=q.t==='many'?(Array.isArray(v)?v:[]):(v?[v]:[]), other=arr.filter(isOther)[0];
    h+='<div class="opts'+(q.row?' row':'')+'" role="group">'+q.opts.concat(q.other?['Другое']:[]).map(function(o){
      var on=o==='Другое'&&q.other?other!==undefined:arr.indexOf(o)>=0;
      return '<button type="button" class="o '+(q.t==='one'?'one':'many')+(on?' on':'')+'" aria-pressed="'+on+'" data-act="pick" data-q="'+esc(q.id)+'" data-o="'+esc(o)+'"><span class="mk">'+CHECK+'</span><span>'+esc(o)+'</span>'+(q.lead&&on&&arr[0]===o?'<span class="tag">основная</span>':'<span></span>')+'</button>'+(on?under(q,o).map(question).join(''):'');
    }).join('')+'</div>';
    if(q.other&&other!==undefined)h+='<input type="text" id="oth-'+esc(q.id)+'" data-oth="'+esc(q.id)+'" maxlength="200" placeholder="Напишите свой вариант" value="'+esc(otherText(other))+'" aria-label="Свой вариант">';
  }else if(q.t==='area'){
    h+='<textarea id="i-'+esc(q.id)+'" data-in="'+esc(q.id)+'" maxlength="2000" placeholder="'+esc(q.ph||'')+'">'+esc(v||'')+'</textarea>';
  }else{
    h+='<input id="i-'+esc(q.id)+'" data-in="'+esc(q.id)+'" type="'+(q.t==='text'?'text':q.t)+'" inputmode="'+({tel:'tel',email:'email',url:'url'}[q.t]||'text')+'" autocomplete="'+esc(q.ac||'off')+'" maxlength="200" placeholder="'+esc(q.ph||'')+'" value="'+esc(v||'')+'">';
  }
  if(bad[q.id])h+='<p class="q-e" role="alert">'+esc(bad[q.id])+'</p>';
  return h+'</div>';
}
function home(){
  var nm=qCount('more'), h='<div class="body">'+(me.joined?'<div class="ok"><svg width="26" height="26" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 6.5l2.6 2.6L10 3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>':'')+
    '<h1 class="h2">'+(card?(me.joined?'Спасибо! Анкета принята':'Проект «'+esc(info.project)+'»'):me.joined?'Вы в проекте «'+esc(info.project)+'»':'Проект «'+esc(info.project)+'»')+'</h1><p class="lead">'+
    (card?(me.joined?'Мы свяжемся с вами в Telegram.'+(me.owner?' Анкету заполнили: '+me.people+'.':''):'Анкету заполнили: '+me.people+'.'):me.joined?'Анкета принята. Участников в проекте: '+me.people+'.':'Анкету заполнили: '+me.people+'.')+'</p>';
  if(card&&me.show){
    var sw=me.show;
    h+='<div class="card show"><p class="kick">О проекте</p><h3>'+esc(sw.title)+'</h3>'+(sw.text?'<p>'+esc(sw.text)+'</p>':'')+((sw.points||[]).length?'<ul>'+sw.points.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'')+'</div>';
  }
  (me.polls||[]).forEach(function(p){
    var max=Math.max.apply(null,p.opts.map(function(o){return o.n}).concat([1])), tail=(p.closed?'Голосование закрыто.':p.mine.length?'Ваш голос учтён. Его можно изменить.':p.multi?'Нажмите на все подходящие варианты.':'Нажмите на подходящий вариант.')+' Проголосовали: '+p.voters+'.';
    h+='<div class="card"><h3>'+esc(p.title)+'</h3><p class="small">'+esc(p.q||'')+'</p>';
    if(p.kind==='time'){
      // a grid of hours: the count on each, the leader marked, names listed under the grid
      h+='<p class="small">Время '+esc(p.zone||'')+'.'+localNote(p)+'</p><div class="tg">'+p.opts.map(function(o){
        var on=p.mine.indexOf(o.t)>=0;
        return '<button type="button" class="tm'+(on?' on':'')+(p.lead===o.t?' lead':'')+'" aria-pressed="'+on+'" aria-label="'+esc(o.t)+', голосов: '+o.n+'" data-act="vote" data-p="'+esc(p.id)+'" data-o="'+esc(o.t)+'"><span class="tm-t">'+esc(o.t)+'</span><span class="tm-n">'+(o.n||'')+'</span></button>';
      }).join('')+'</div>';
      if(p.lead)h+='<p class="win"><b>'+esc(p.lead)+'</b> — пока большинство'+(p.toEvent?'. На это время встреча стоит в календаре проекта.':'.')+'</p>';
      var who=p.opts.filter(function(o){return o.n});
      if(who.length)h+='<div class="wl">'+who.map(function(o){return '<div><b>'+esc(o.t)+'</b><span>'+esc(o.who.join(', '))+'</span></div>'}).join('')+'</div>';
    }else{
      h+='<div class="pv">'+p.opts.map(function(o){
        var on=p.mine.indexOf(o.t)>=0;
        return '<button type="button" class="po'+(on?' on':'')+'" aria-pressed="'+on+'" data-act="vote" data-p="'+esc(p.id)+'" data-o="'+esc(o.t)+'"><i class="fill" style="width:'+(o.n/max*100).toFixed(0)+'%"></i><span class="mk'+(p.multi?'':' rnd')+'">'+CHECK+'</span><span><span class="po-t">'+esc(o.t)+'</span><span class="po-w">'+(o.who.length?esc(o.who.join(', ')):'пока никто')+'</span></span><span class="po-n">'+o.n+'</span></button>';
      }).join('')+'</div>';
    }
    h+='<p class="small" id="pn-'+esc(p.id)+'">'+tail+'</p></div>';
  });
  h+='<div class="hero">'+(card?'':'<a class="btn pri" style="flex:none" href="/">Открыть проект</a>');
  if(me.joined&&nm)h+='<div class="card"><h3>'+(me.more?'Расширенная анкета':'Расскажите о себе больше')+'</h3><p class="small">'+esc(F.moreIntro||'')+' '+nm+' '+plural(nm,'вопрос','вопроса','вопросов')+', '+esc(F.moreTime||'')+'.</p><button class="btn wide" data-act="more">'+(me.more?'Изменить ответы':'Дополнить анкету')+'</button></div>';
  h+='<button class="link" data-act="edit">'+(me.joined?'Изменить основные ответы':'Заполнить анкету')+'</button></div></div>';
  return h;
}

/* ---------- answers ---------- */
// the poll's hours are in one zone; a device in another zone gets a line with its own clock
function localNote(p){
  try{
    var t0=p.opts[0].t, d=new Date(p.date+'T'+t0+':00'+p.offset), z=p.offset.split(':'), min=(+z[0])*60+(z[0].charAt(0)==='-'?-1:1)*(+z[1]||0);
    if(isNaN(d)||-d.getTimezoneOffset()===min)return '';
    return ' На вашем устройстве другой пояс: '+t0+' здесь — это '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+' у вас.';
  }catch(e){return ''}
}
function pick(qid,o,el){
  var q=findQ(qid), v=A[qid];
  if(q.t==='one'){A[qid]=o==='Другое'&&q.other?(isOther(v)?v:'Другое'):o}
  else{
    var arr=Array.isArray(v)?v.slice():[], i=o==='Другое'&&q.other?arr.findIndex(isOther):arr.indexOf(o);
    if(i>=0)arr.splice(i,1);
    else{
      if(q.max&&arr.length>=q.max){el.classList.remove('nope');void el.offsetWidth;el.classList.add('nope');haptic('error');bad[qid]='Можно выбрать не больше '+q.max+'. Снимите один из вариантов.';return paint(qid)}
      arr.push(o);
    }
    A[qid]=arr;
  }
  delete bad[qid];keep();haptic();
  if(feeds(qid)){var y=window.scrollY;render();window.scrollTo(0,y)}else paint(qid);
  if(o==='Другое'&&q.other){var x=document.getElementById('oth-'+qid);if(x)x.focus()}
}
function paint(qid){
  var el=app.querySelector('.q[data-q="'+qid+'"]');if(!el)return render();
  var d=document.createElement('div');d.innerHTML=question(findQ(qid));el.replaceWith(d.firstChild);
}
function findQ(id){var r=null;F.steps.forEach(function(s){s.qs.forEach(function(q){if(q.id===id)r=q})});return r}
function check(s){
  bad={};
  shown(s).forEach(function(q){
    var v=A[q.id], empty=q.t==='many'?!(Array.isArray(v)&&v.length):!String(v||'').trim();
    if(q.req&&empty)bad[q.id]=q.opts?'Выберите вариант':'Заполните это поле';
    else if(!empty&&q.t==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v).trim()))bad[q.id]='Проверьте адрес: в нём должны быть @ и точка';
    else if(!empty&&q.t==='tel'&&String(v).replace(/\D/g,'').length<5)bad[q.id]='Проверьте номер: слишком мало цифр';
    else if(q.t==='many'&&q.max&&Array.isArray(v)&&v.length>q.max)bad[q.id]='Можно выбрать не больше '+q.max;
  });
  return !Object.keys(bad).length;
}
function payload(p){var o={};steps(p).forEach(function(s){shown(s).forEach(function(q){if(A[q.id]!==undefined)o[q.id]=A[q.id]})});return o}
function toFirstBad(){var el=app.querySelector('.q.bad');if(el)el.scrollIntoView({block:'center',behavior:'smooth'})}
function next(){
  if(busy)return;
  var ss=steps(part), s=ss[step], last=step===ss.length-1;
  note='';
  if(preview){
    bad={};
    if(!last)step++;else{me.joined=true;if(part==='more')me.more=true;if(card)me.show=info.show;scr='home'}
    render();return window.scrollTo(0,0);
  }
  if(!check(s)){haptic('error');render();return toFirstBad()}
  if(part==='core'&&!last){step++;render();return window.scrollTo(0,0)}
  if(part==='core'&&F.agree&&!agreed){bad._agree='Без согласия анкета не сохраняется. Отметьте эту строку.';haptic('error');return render()}
  busy=true;render();
  api('POST','/submit',{initData:initData,part:part,answers:payload(part),agree:agreed}).then(function(j){
    busy=false;me=j;A=Object.assign({},A,j.answers);keep();
    if(last){scr='home';haptic('ok')}else step++;
    render();window.scrollTo(0,0);
  },function(e){
    busy=false;
    if(e.code==='bad_answers'&&e.fields.length){
      e.fields.forEach(function(id){bad[id]='Проверьте этот ответ'});
      var i=ss.findIndex(function(x){return x.qs.some(function(q){return e.fields.indexOf(q.id)>=0})});if(i>=0)step=i;
    }
    note=e.code==='no_consent'?'Без согласия на хранение данных анкета не сохраняется.':e.code==='link_closed'?'Ссылка на анкету больше не действует. Попросите у организатора новую.':e.code==='unauthorized'?'Telegram не подтвердил вход. Закройте окно и откройте анкету из бота ещё раз.':e.code==='network'?'Нет связи с сервером. Ответы сохранены на этом устройстве: попробуйте ещё раз через минуту.':'Не получилось сохранить. Попробуйте ещё раз.';
    haptic('error');render();toFirstBad();
  });
}
// A tap on a segment of the header. Back is always free; forward stops at the first step of the
// main part that still misses a required answer. The extended part is optional, so any step opens.
function go(i){
  var ss=steps(part);
  if(busy||i===step||i<0||i>=ss.length)return;
  note='';bad={};
  if(part==='core'&&i>step&&!preview){
    for(var k=step;k<i;k++){if(!check(ss[k])){step=k;haptic('error');render();return toFirstBad()}}
  }
  step=i;haptic();render();window.scrollTo(0,0);
}
function back(){
  note='';bad={};
  if(step>0){step--;render();return window.scrollTo(0,0)}
  scr=me.joined?'home':'hello';render();
}
function vote(pid,o){
  var p=me.polls.filter(function(x){return x.id===pid})[0];if(!p||busy)return;
  if(preview){var pn=document.getElementById('pn-'+pid);if(pn)pn.textContent='В предпросмотре голос не сохраняется.';return}
  var picks=p.mine.slice(), i=picks.indexOf(o);
  if(i>=0)picks.splice(i,1);else if(p.multi)picks.push(o);else picks=[o];
  busy=true;haptic();
  api('POST','/vote',{initData:initData,poll:pid,picks:picks}).then(function(j){busy=false;me=j;render()},function(e){
    busy=false;var n=document.getElementById('pn-'+pid);
    if(n)n.textContent=e.code==='core_first'?'Голосование открывается после анкеты.':e.code==='closed'?'Голосование уже закрыто.':'Не получилось сохранить голос. Попробуйте ещё раз.';
  });
}
function begin(p){
  part=p;step=0;note='';bad={};scr='form';seen={};
  // answers that are already there (a return visit, an edit) open their steps for jumping
  steps(p).forEach(function(s,i){if(s.qs.some(function(q){return A[q.id]!==undefined}))seen[p+i]=true});
  // what Telegram already knows goes in first: fewer fields to type
  F.steps.forEach(function(s){s.qs.forEach(function(q){
    if(A[q.id]!==undefined)return;
    if(q.fill==='name'&&me.user.name)A[q.id]=me.user.name;
    if(q.fill==='telegram'&&q.opts.indexOf('Telegram')>=0)A[q.id]=['Telegram'];
  })});
  render();window.scrollTo(0,0);
}

app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act');
  if(a==='pick')pick(t.getAttribute('data-q'),t.getAttribute('data-o'),t);
  else if(a==='next')next();
  else if(a==='agree'){agreed=!agreed;delete bad._agree;haptic();var y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='go')go(+t.getAttribute('data-i'));
  else if(a==='back')back();
  else if(a==='begin'||a==='edit')begin('core');
  else if(a==='more')begin('more');
  else if(a==='vote')vote(t.getAttribute('data-p'),t.getAttribute('data-o'));
  else if(a==='home'){scr='home';render()}
  else if(a==='pv-home'){me.joined=true;if(card)me.show=info.show;scr='home';render();window.scrollTo(0,0)}
  else if(a==='reload')location.reload();
});
app.addEventListener('input',function(e){
  var t=e.target, id=t.getAttribute('data-in'), oid=t.getAttribute('data-oth');
  if(id){A[id]=t.value;keep()}
  else if(oid){
    var q=findQ(oid), val='Другое'+(t.value.trim()?': '+t.value.trim():'');
    if(q.t==='one')A[oid]=val;else A[oid]=(A[oid]||[]).map(function(x){return isOther(x)?val:x});
    keep();
  }
});

/* ---------- start ---------- */
theme();
try{if(tg){tg.ready();tg.expand();if(tg.onEvent)tg.onEvent('themeChanged',theme);if(tg.BackButton)tg.BackButton.onClick(back)}}catch(e){}
function fail(e){
  note=preview?(e.code==='no_form'?'У этого проекта нет такой анкеты.':'Предпросмотр не открылся. Закрой это окно и открой его из дэшборда ещё раз.'):e.code==='link_closed'?'Ссылка на анкету больше не действует. Попросите у организатора новую.':e.code==='unauthorized'?'Telegram не подтвердил вход. Закройте окно и откройте анкету из бота ещё раз.':'Сервер не отвечает. После простоя он просыпается около минуты: обновите страницу чуть позже.';
  scr='error';render();
}
if(!token){note='В ссылке нет кода анкеты.';scr='error';render()}
else api('GET','').then(function(j){
  info=j;F=j.form;card=j.access==='card';document.title=F.title;
  if(preview){me=j.me;A={};agreed=false;scr='hello';return render()}
  if(!initData){scr='gate';return render()}
  return api('POST','/me',{initData:initData}).then(function(m){
    me=m;A=Object.assign({},kept(),m.answers);agreed=!!m.agreed;
    scr=m.joined?'home':'hello';render();
  });
}).catch(fail);
})();
</script>
