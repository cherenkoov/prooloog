<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Документ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* A document the team answers. Same palette and type as the dashboard and the onboarding form. */
:root{
  --bg:#eceef3; --surface:#ffffff; --surface2:#f3f4f8; --ink:#14161c; --mute:#5f6575; --line:#dcdfe8;
  --accent:#1c8556; --on-accent:#ffffff; --crit:#c2362b;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e1015; --surface:#171a22; --surface2:#1e222c; --ink:#eceef4; --mute:#9aa1b2; --line:#2b303c;
  --accent:#4fc48c; --on-accent:#06281a; --crit:#f2766a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
button,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
h1,h2,h3,p,ul,ol{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

#app{max-width:720px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}
.kick{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lead{color:var(--mute)}
.small{font-size:13px;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
a.btn{text-decoration:none;color:inherit}
a.btn.pri{color:var(--on-accent)}
.btn[disabled]{opacity:.55}

/* the text */
.doc{display:flex;flex-direction:column;gap:14px;overflow-wrap:break-word}
.doc h1{font:600 30px/1.12 var(--display);letter-spacing:-.02em;text-wrap:balance}
.doc h2{font:600 20px/1.2 var(--display);letter-spacing:-.01em;margin-top:14px;text-wrap:balance}
.doc h3{font:600 17px/1.25 var(--body);margin-top:6px}
.doc p:first-of-type{font-size:17px}
.doc ul,.doc ol{padding-left:22px;display:flex;flex-direction:column;gap:6px}
.doc ul.check{list-style:none;padding-left:0}
.doc ul.check li{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start}
.doc ul.check i{width:18px;height:18px;margin-top:3px;border-radius:5px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--accent)}
.doc a{color:var(--accent);text-underline-offset:3px}
.doc code{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface2);padding:1px 5px;border-radius:5px}
.doc blockquote{margin:0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 12px 12px 0;color:var(--mute)}
.doc hr{border:0;border-top:1px solid var(--line);width:100%;margin:6px 0}
.tw{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.doc table{width:100%;border-collapse:collapse;font-size:15px}
.doc th,.doc td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.doc tr:last-child td{border-bottom:0}
.doc th{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);background:var(--surface2)}
.doc td:first-child{font-weight:600}
.doc th{white-space:nowrap}
@media (min-width:561px){.doc td:first-child{min-width:150px}.doc td:not(:first-child):not(:last-child){white-space:nowrap}}
/* on a phone a row of a table becomes a card: the heading of a column stands above its value */
@media (max-width:560px){
  .doc thead{display:none}
  .doc table,.doc tbody,.doc tr,.doc td{display:block}
  .doc tr{padding:12px 14px;border-bottom:1px solid var(--line)}
  .doc tr:last-child{border-bottom:0}
  .doc td{padding:0;border:0}
  .doc td+td{margin-top:8px}
  .doc td+td::before{content:attr(data-h);display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
  .doc td:first-child{font-size:16px}
}

/* the answer */
.ans{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-top:8px}
.ans h2{font:600 19px/1.2 var(--display)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts .btn{flex:1 1 200px}
.ok{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.ok i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.ok b{display:block}
.ask{display:flex;flex-direction:column;gap:10px}
.ask label{font-weight:600}
.ask textarea{width:100%;min-height:120px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);resize:vertical;line-height:1.45}
.ask textarea:focus{outline:none;border-color:var(--accent)}
.cnt{align-self:flex-end;font-size:12px;color:var(--mute)}
.err{color:var(--crit);font-weight:500}
.asked{display:flex;flex-direction:column;gap:8px}
.asked div{padding:10px 14px;border-radius:14px;background:var(--surface2);white-space:pre-wrap;overflow-wrap:anywhere}
.asked span{display:block;font-size:12px;color:var(--mute);margin-top:4px}
.gate{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.gate h1{font:600 26px/1.15 var(--display);letter-spacing:-.02em}
</style>
</head>
<body>
<div id="app" aria-live="polite"><p class="lead">Загружаю документ…</p></div>
<script>
(function(){
'use strict';
var tg=window.Telegram&&window.Telegram.WebApp, initData=(tg&&tg.initData)||'';
var token=(/\/o\/([A-Za-z0-9_-]{16})(?:$|[/?#])/.exec(location.pathname)||[])[1]||'';
var app=document.getElementById('app'), KEY='prooloog.offer.'+token;
var S=null, info=null, mode='', busy=false, err='', draft='';
var CHECK='<svg width="14" height="14" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 6.5l2.6 2.6L10 3.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function theme(){var dark=tg&&tg.colorScheme?tg.colorScheme==='dark':window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.setAttribute('data-theme',dark?'dark':'light')}
function haptic(k){try{if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred(k==='ok'?'success':'error')}catch(e){}}
function when(iso){var d=new Date(iso);if(isNaN(d))return '';var m=d.getMinutes();return d.getDate()+' '+MON[d.getMonth()]+', '+d.getHours()+':'+(m<10?'0':'')+m}
function api(method,path,body){
  return fetch('/api/offer/'+token+path,{method:method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined}).then(function(r){
    return r.json().catch(function(){return null}).then(function(j){if(!r.ok){var e=new Error((j&&j.error)||'http_'+r.status);e.code=(j&&j.error)||'';throw e}return j});
  },function(){var e=new Error('network');e.code='network';throw e});
}

/* ---------- a small Markdown: headings, paragraphs, lists, check lists, tables, quotes, bold, code, links ---------- */
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,function(_,t,u){return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+t+'</a>'});
  return s;
}
function cells(l){l=l.trim().replace(/^\|/,'').replace(/\|$/,'');return l.split(/(?<!\\)\|/).map(function(c){return c.trim().replace(/\\\|/g,'|')})}
function md(src){
  var L=String(src||'').replace(/\r\n?/g,'\n').split('\n'), out=[], i=0, m;
  var isBlock=function(l){return /^\s*(#{1,6}\s|[-*+]\s|\d+[.)]\s|\||>|---+\s*$)/.test(l)};
  while(i<L.length){
    var l=L[i];
    if(!l.trim()){i++;continue}
    if((m=/^\s*(#{1,6})\s+(.+?)\s*#*\s*$/.exec(l))){var n=Math.min(m[1].length,3);out.push('<h'+n+'>'+inline(m[2])+'</h'+n+'>');i++;continue}
    if(/^\s*---+\s*$/.test(l)){out.push('<hr>');i++;continue}
    if(/^\s*\|/.test(l)){
      var rows=[];while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(cells(L[i]));i++}
      var head=rows.length>1&&rows[1].every(function(c){return /^:?-{2,}:?$/.test(c)})?rows[0]:null, body=head?rows.slice(2):rows;
      out.push('<div class="tw"><table>'+(head?'<thead><tr>'+head.map(function(c){return '<th>'+inline(c)+'</th>'}).join('')+'</tr></thead>':'')+'<tbody>'+
        body.map(function(r){return '<tr>'+r.map(function(c,k){return '<td'+(head&&head[k]?' data-h="'+esc(head[k])+'"':'')+'>'+inline(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>');
      continue;
    }
    if(/^\s*>/.test(l)){var q=[];while(i<L.length&&/^\s*>/.test(L[i])){q.push(L[i].replace(/^\s*>\s?/,''));i++}out.push('<blockquote>'+inline(q.join(' '))+'</blockquote>');continue}
    if(/^\s*[-*+]\s/.test(l)||/^\s*\d+[.)]\s/.test(l)){
      var ord=/^\s*\d+[.)]\s/.test(l), re=ord?/^\s*\d+[.)]\s+(.*)$/:/^\s*[-*+]\s+(.*)$/, items=[], check=!ord;
      while(i<L.length&&(m=re.exec(L[i]))){
        var t=m[1];i++;
        // a line that goes on below, indented, belongs to the same item
        while(i<L.length&&/^\s{2,}\S/.test(L[i])&&!re.test(L[i])){t+=' '+L[i].trim();i++}
        items.push(t);
      }
      check=check&&items.every(function(t){return /^\[[ xX]\]\s/.test(t)});
      out.push(check?'<ul class="check">'+items.map(function(t){return '<li><i>'+(/^\[[xX]\]/.test(t)?CHECK:'')+'</i><span>'+inline(t.replace(/^\[[ xX]\]\s+/,''))+'</span></li>'}).join('')+'</ul>'
        :'<'+(ord?'ol':'ul')+'>'+items.map(function(t){return '<li>'+inline(t)+'</li>'}).join('')+'</'+(ord?'ol':'ul')+'>');
      continue;
    }
    var p=[l.trim()];i++;
    while(i<L.length&&L[i].trim()&&!isBlock(L[i])){p.push(L[i].trim());i++}
    out.push('<p>'+inline(p.join(' '))+'</p>');
  }
  return out.join('');
}

/* ---------- screens ---------- */
function answerBox(){
  var m=S.mine, h='<section class="ans"><h2>Ваш ответ</h2>';
  if(m.yes)h+='<div class="ok"><i>'+CHECK+'</i><div><b>Вы согласились с условиями</b><span class="small">'+esc(when(m.yes))+' · '+esc(S.user.name)+'</span></div></div>';
  if(m.asks.length)h+='<div class="asked"><p class="small">Ваши вопросы переданы координаторам проекта. Ответ придёт в Telegram.</p>'+m.asks.map(function(a){return '<div>'+esc(a.text)+'<span>'+esc(when(a.at))+'</span></div>'}).join('')+'</div>';
  if(mode==='ask'){
    h+='<div class="ask"><label for="q">Что хотите уточнить?</label><textarea id="q" maxlength="2000" placeholder="Напишите вопрос или что стоит изменить в условиях">'+esc(draft)+'</textarea>'+
      '<span class="cnt" id="cnt">'+draft.length+' / 2000</span>'+(err?'<p class="err">'+esc(err)+'</p>':'')+
      '<div class="acts"><button class="btn pri" data-a="send"'+(busy?' disabled':'')+'>'+(busy?'Отправляю…':'Отправить вопрос')+'</button><button class="btn" data-a="back"'+(busy?' disabled':'')+'>Отмена</button></div></div>';
  }else{
    if(!m.yes&&!m.asks.length)h+='<p class="lead">Отвечаете как '+esc(S.user.name)+'. Ответ увидят координаторы проекта'+(S.project?' «'+esc(S.project)+'»':'')+'.</p>';
    if(err)h+='<p class="err">'+esc(err)+'</p>';
    h+='<div class="acts">'+(m.yes?'':'<button class="btn pri" data-a="yes"'+(busy?' disabled':'')+'>'+(busy?'Отправляю…':'Согласен с условиями')+'</button>')+
      '<button class="btn" data-a="ask"'+(busy?' disabled':'')+'>'+(m.asks.length?'Уточнить ещё':'Хочу уточнить')+'</button></div>';
  }
  return h+'</section>';
}
function render(keepScroll){
  var y=window.scrollY;
  if(S){
    document.title=S.title;
    app.innerHTML=(S.project?'<p class="kick">'+esc(S.project)+'</p>':'')+'<article class="doc">'+md(S.md)+'</article>'+answerBox();
    if(mode==='ask'){var t=document.getElementById('q');if(t&&!busy){t.focus();t.setSelectionRange(t.value.length,t.value.length)}}
    if(keepScroll)window.scrollTo(0,y);
  }
}
function gate(text,link){
  app.innerHTML='<div class="gate">'+(info?'<p class="kick">'+esc(info.app)+'</p><h1>'+esc(info.title)+'</h1>':'')+'<p class="lead">'+esc(text)+'</p>'+(link?'<a class="btn pri" href="'+esc(link)+'">Открыть в Telegram</a>':'')+'</div>';
}
function words(e){return e.code==='network'?'Нет связи. Проверьте интернет и попробуйте ещё раз.':e.code==='link_closed'?'Этот документ больше не доступен.':e.code==='unauthorized'?'Сессия Telegram устарела. Закройте документ и откройте его заново.':e.code==='rate_limited'?'Слишком много запросов. Попробуйте через минуту.':'Не получилось отправить. Попробуйте ещё раз.'}
function send(kind,text){
  if(busy)return;busy=true;err='';render(true);
  api('POST','/answer',{initData:initData,kind:kind,text:text}).then(function(j){
    busy=false;S=j;if(kind==='ask'){mode='';draft='';try{localStorage.removeItem(KEY)}catch(e){}}haptic('ok');render(true);
  },function(e){busy=false;err=words(e);haptic('error');render(true)});
}
app.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-a]');if(!b||busy)return;
  var a=b.getAttribute('data-a');
  if(a==='yes')return send('yes','');
  if(a==='ask'){mode='ask';err='';return render(true)}
  if(a==='back'){mode='';err='';return render(true)}
  if(a==='send'){
    var t=(document.getElementById('q').value||'').trim();draft=t;
    if(t.length<2){err='Напишите, что хотите уточнить.';return render(true)}
    return send('ask',t);
  }
});
app.addEventListener('input',function(ev){
  if(ev.target.id!=='q')return;
  draft=ev.target.value;var c=document.getElementById('cnt');if(c)c.textContent=draft.length+' / 2000';
  if(err){err='';var x=app.querySelector('.err');if(x)x.remove()}
  try{localStorage.setItem(KEY,draft)}catch(e){}
});

/* ---------- start ---------- */
theme();
try{if(tg){tg.ready();tg.expand();if(tg.onEvent)tg.onEvent('themeChanged',theme)}}catch(e){}
try{draft=localStorage.getItem(KEY)||''}catch(e){}
if(!token)gate('В ссылке нет кода документа.');
else if(!initData)api('GET','').then(function(j){info=j;document.title=j.title;gate('Документ открывается в Telegram: так координаторы проекта видят, кто ответил.',j.bot?'https://t.me/'+j.bot+'?start='+j.start:'')},function(e){gate(words(e))});
else api('POST','/me',{initData:initData}).then(function(j){S=j;if(draft&&!j.mine.yes)mode='';render()},function(e){gate(words(e))});
})();
</script>
</body>
</html>
